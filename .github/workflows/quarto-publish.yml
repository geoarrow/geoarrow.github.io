on:
  workflow_dispatch:
  push:
    branches: main

name: Render and Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2

      - name: Sync geoarrow/geoarrow
        run: |
          ./sync-external.sh
        env:
          GEOARROW_REF: "005d02de3dd5895cba5fe5e7e862814a62a9b7e5"
          GEOARROW_DATA_REF: "e8eaa04487d982398f07713cde527c5c5edeee1e"

      - name: Publish to GitHub Pages (and render)
        uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this secret is always available for github actions
